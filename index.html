<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 – Halaman Tidak Ditemukan</title>
<style>
:root{
  --bg:#b4bdc8; --bg2:#87939f; --text:#242d3a; --muted:#444f5d;
  --cloud:#cfd6df; --cloud-edge:#74849a; --face:#2b3645; --rain:#5b8fc7; --puddle:#8fb3da;
  --btn:#2b3645; --btn-text:#f4f7fb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --bg2:#192231; --text:#e6ecf4; --muted:#93a1b4;
    --cloud:#4a586b; --cloud-edge:#6d7f96; --face:#e6ecf4; --rain:#7aa7da; --puddle:#2c4466;
    --btn:#e6ecf4; --btn-text:#10161f;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --bg2:#192231; --text:#e6ecf4; --muted:#93a1b4;
  --cloud:#4a586b; --cloud-edge:#6d7f96; --face:#e6ecf4; --rain:#7aa7da; --puddle:#2c4466;
  --btn:#e6ecf4; --btn-text:#10161f;
}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-30px;width:2px;height:16px;background:var(--rain);opacity:.45;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
main{position:relative;text-align:center;padding:24px;max-width:480px;z-index:1}
.scene{width:min(320px,80vw);margin:0 auto}
svg{width:100%;height:auto;overflow:visible}
.cloud{animation:sob 3s ease-in-out infinite;transform-origin:center}
@keyframes sob{0%,100%{transform:translateY(0)}10%{transform:translateY(5px)}20%{transform:translateY(0)}30%{transform:translateY(5px)}40%{transform:translateY(0)}70%{transform:translateY(12px)}}
.tear{fill:var(--rain);animation:tear 1.2s ease-in infinite;opacity:0}
.tear.r{animation-delay:.6s}.tear.c{animation-delay:.3s}.tear.d{animation-delay:.9s}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(105px)}}
.eyes{animation:blink 6s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ripple{fill:none;stroke:var(--rain);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ripple 1.8s ease-out infinite}
.ripple.b{animation-delay:.9s}
@keyframes ripple{0%{opacity:.8;transform:scale(.2)}100%{opacity:0;transform:scale(1.4)}}
h1{font-size:clamp(64px,18vw,104px);margin:8px 0 0;line-height:1;letter-spacing:-2px;font-weight:800}
h1 span{display:inline-block;animation:droop 3s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.25s;opacity:.85}
h1 span:nth-child(3){animation-delay:.5s}
@keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(6px) rotate(-3deg)}}
h2{font-size:20px;margin:10px 0 6px;font-weight:600}
p{margin:0 0 22px;color:var(--muted);line-height:1.6;font-size:15px}
a.btn{display:inline-block;background:var(--btn);color:var(--btn-text);padding:12px 26px;border-radius:999px;text-decoration:none;font-weight:600;transition:transform .2s}
a.btn:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){
  .drop,.cloud,.tear,.eyes,.ripple,h1 span{animation:none}
  .tear{opacity:.8}
}
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<main>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
      <g class="cloud">
        <path d="M70 130c-26 0-44-16-44-38 0-20 16-36 38-37 6-24 28-40 54-40 24 0 44 12 52 32 6-3 14-5 22-5 26 0 46 18 46 42 0 24-20 46-48 46z"
              fill="var(--cloud)" stroke="var(--cloud-edge)" stroke-width="3" stroke-linejoin="round" transform="translate(0,14)"/>
        <g class="eyes">
          <ellipse cx="112" cy="100" rx="9" ry="11" fill="var(--face)"/><circle cx="109" cy="96" r="3.5" fill="var(--cloud)"/>
          <ellipse cx="188" cy="100" rx="9" ry="11" fill="var(--face)"/><circle cx="185" cy="96" r="3.5" fill="var(--cloud)"/>
        </g>
        <path d="M92 88l32-18M208 88l-32-18" stroke="var(--face)" stroke-width="4" stroke-linecap="round"/>
        <path d="M124 136q26-26 52 0" fill="none" stroke="var(--face)" stroke-width="4" stroke-linecap="round"/>
        <path class="tear" d="M112 114c-8 12-8 18 0 18s8-6 0-18z"/><path class="tear c" d="M106 114c-6 10-6 15 0 15s6-5 0-15z"/>
        <path class="tear r" d="M188 114c-8 12-8 18 0 18s8-6 0-18z"/><path class="tear d" d="M194 114c-6 10-6 15 0 15s6-5 0-15z"/>
      </g>
      <ellipse cx="150" cy="238" rx="90" ry="12" fill="var(--puddle)" opacity=".6"/>
      <ellipse class="ripple" cx="112" cy="238" rx="30" ry="6"/>
      <ellipse class="ripple b" cx="188" cy="238" rx="30" ry="6"/>
    </svg>
  </div>
  <h1><span>4</span><span>0</span><span>4</span></h1>
  <h2>Hiks... hiks... halamannya pergi dan tidak kembali</h2>
  <p>Awan kecil ini sudah mencari ke mana-mana sepanjang malam, tapi halaman yang kamu cari tetap tidak ada. Mungkin sudah dihapus, mungkin memang tidak pernah ada... dan sekarang dia sendirian di tengah hujan.</p>
  <a class="btn" href="/" onclick="if(history.length>1){history.back();return false}">Pulang saja, yuk</a>
</main>
<script>
(function(){
  var box=document.getElementById('rain');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(var i=0;i<90;i++){
    var d=document.createElement('div');
    d.className='drop';
    d.style.left=Math.random()*100+'%';
    d.style.animationDuration=(0.7+Math.random()*0.8)+'s';
    d.style.animationDelay=(-Math.random()*2)+'s';
    d.style.opacity=0.25+Math.random()*0.4;
    box.appendChild(d);
  }
})();
</script>
</body>
</html>
